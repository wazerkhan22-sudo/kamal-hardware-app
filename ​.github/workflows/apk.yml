
name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Buildozer & Dependencies
      run: |
        sudo apt update
        sudo apt install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libffi-dev libssl-dev
        pip install buildozer cython

    - name: Unzip project files
      run: |
        unzip -o KamalHardwareApp.zip || true

    - name: Build APK with Buildozer
      run: |
        buildozer init
        sed -i 's/title = My Application/title = Kamal Hardware/g' buildozer.spec
        sed -i 's/package.name = myapp/package.name = kamalhardware/g' buildozer.spec
        buildozer -v android debug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: KamalHardwareApp-APK
        path: bin/*.apk
